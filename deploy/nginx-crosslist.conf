# ============================================================
# CrossList AI —— nginx 单入口反向代理（同机部署方案）
#
# 安装位置（二选一）：
#   /etc/nginx/conf.d/crosslist.conf          （Debian/Ubuntu 直接生效）
#   /etc/nginx/sites-available/crosslist      （再 ln -s 到 sites-enabled/）
#
# 生效：nginx -t && systemctl reload nginx
# ============================================================

upstream crosslist_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream crosslist_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # 还没有域名就保持 _ 通配，直接用 http://<服务器IP>/ 访问；
    # 有域名后替换成域名（并给它签 HTTPS 证书）
    server_name _;

    # 前端的「实拍图」是多图上传，默认 1m 会直接 413
    client_max_body_size 50m;

    # ---------- 后端 FastAPI ----------
    # 注意：proxy_pass 结尾【不能】带斜杠。
    #   http://crosslist_backend    → 原样转发 /api/jobs  ✅ FastAPI 路由就是 /api/xxx
    #   http://crosslist_backend/   → 会剥掉 /api → 全部 404 ❌
    location /api/ {
        proxy_pass http://crosslist_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ---- 进度页用 SSE（/api/jobs/{id}/events）流式推送 ----
        # 不关缓冲的话事件会被 nginx 攒在缓冲区，前端进度条卡住不动。
        # 后端已返回 X-Accel-Buffering: no，这里双重保险。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;   # 生成任务可能跑十几分钟
        proxy_send_timeout 3600s;
    }

    # ---------- 前端 Next.js ----------
    location / {
        proxy_pass http://crosslist_frontend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next dev 模式的 HMR 用；生产环境留着无害
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # gzip（Next 已自行压缩静态资源，这里只补文本类接口）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;
}
